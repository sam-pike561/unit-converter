<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="background" id="main">
        <h1 id="heading">Metric/Imperial Unit Conversion</h1>
        
            
            <input id="input-el" placeholder="20">
            <button id="convert-btn">Convert</button>
        </div>
        <div class="grid-list-card">   
            <div class="conversion-results" id="length-el">
                <h3 class="supporting-text">Length (Meter/Feet)</h3>
            </div>
        </div>
        <div class="grid-list-card">
            <div class="conversion-results" id="volume-el">
            <h3 class="supporting-text">Volume (Liters/Gallons)</h3>
        </div>
        </div>
        <div class="grid-list-card">
            <div class="conversion-results" id="mass-el">
            <h3 class="supporting-text">Mass (Kilograms/Pounds)</h3>
        </div>
        </div>
                
        <script src="index.js"></script>
    </body>
</html>
